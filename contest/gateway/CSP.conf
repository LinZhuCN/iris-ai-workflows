CSPModulePath "${ISC_PACKAGE_INSTALLDIR}/bin/"
CSPConfigPath "${ISC_PACKAGE_INSTALLDIR}/bin/"

<Location "/csp/">
    SetHandler csp-handler-sa
</Location>

<Location "/csp/healthshare/fhirdemo/fhir/r4">
    CSP On
    SetHandler csp-handler-sa
</Location>

<Location "/csp/multiresearch">
    CSP On
    SetHandler csp-handler-sa
</Location>

<Location "/api/atelier/">
    CSP On
    SetHandler csp-handler-sa
</Location>

<Location "/api/monitor/">
    CSP On
    SetHandler csp-handler-sa
</Location>

<Location "/csp/bin/">
    Require all denied
</Location>

<Directory "${ISC_PACKAGE_INSTALLDIR}/bin/">
    AllowOverride None
    Options None
    Require all granted
    <FilesMatch "\.(log|ini|pid|exe)$">
        Require all denied
    </FilesMatch>
</Directory>
