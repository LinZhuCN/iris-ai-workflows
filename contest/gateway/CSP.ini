[SYSTEM]
IRISCONNECT_LIBRARY_PATH=/opt/webgateway/bin
System_Manager=127.0.0.1
Server_Response_Timeout=120
Default_Server=Triage

[SYSTEM_INDEX]
Triage=Enabled

[APP_PATH_INDEX]
/csp=Enabled
/api/atelier=Enabled

[APP_PATH:/csp]
Default_Server=Triage

[APP_PATH:/api/atelier]
Default_Server=Triage

[Triage]
Ip_Address=iris
TCP_Port=1972
Connection_Security_Level=0
Minimum_Server_Connections=3
Maximum_Session_Connections=6
